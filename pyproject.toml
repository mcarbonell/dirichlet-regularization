[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dirichlet-regularization"
version = "1.1.0"
authors = [
  { name = "Mario Raúl Carbonell Martínez", email = "marioraulcarbonell@gmail.com" }
]
description = "2D Dirichlet spatial regularization for neural network weights: inducing topographic smoothness for 2D-DCT spectral compression and Base-3 trit quantization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = [
    "deep-learning",
    "pytorch",
    "regularization",
    "dirichlet-energy",
    "dct",
    "quantization",
    "model-compression",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
examples = [
    "torchvision>=0.15.0",
    "matplotlib>=3.5.0",
]
benchmarks = [
    "modal>=0.50.0",
    "datasets>=2.0.0",
    "tokenizers>=0.13.0",
    "transformers>=4.28.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.65.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = ["dreg"]

[project.urls]
"Homepage" = "https://github.com/mcarbonell/dirichlet-regularization"
"Repository" = "https://github.com/mcarbonell/dirichlet-regularization"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I001"]
ignore = ["E501"]


