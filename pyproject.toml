[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dirichlet-regularization"
version = "1.0.0"
authors = [
  { name = "M. Carbonell" }
]
description = "Dirichlet Spatial Regularization for Neural Networks: cortical-inspired topographic smoothness enabling extreme spectral compressibility"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
]

[tool.setuptools]
packages = ["dreg"]

[project.urls]
"Homepage" = "https://github.com/mcarbonell/dirichlet-regularization"
"Repository" = "https://github.com/mcarbonell/dirichlet-regularization"

[tool.pytest.ini_options]
testpaths = ["tests"]

